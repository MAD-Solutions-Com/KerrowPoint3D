<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" width="1600" height="2000"><rect width="1600" height="2000" fill="#f3ead6"/><rect x="40" y="40" width="1520" height="1920" fill="none" stroke="#231e16" stroke-width="6"/><rect x="58" y="58" width="1484" height="1884" fill="none" stroke="#231e16" stroke-width="2"/><text x="800.0" y="190" text-anchor="middle" font-size="74" letter-spacing="6" fill="#231e16" font-family="Source Serif 4, Georgia, serif">NOTICE TO MARINERS</text><text x="800.0" y="300" text-anchor="middle" font-size="96" letter-spacing="8" fill="#231e16" font-family="Source Serif 4, Georgia, serif">KERROW BAR</text><text x="800.0" y="370" text-anchor="middle" font-size="40" font-style="italic" fill="#231e16" font-family="Source Serif 4, Georgia, serif">the sandbank across the harbour mouth</text><text x="800.0" y="480" text-anchor="middle" font-size="52" fill="#231e16" font-family="Source Serif 4, Georgia, serif">Least depth over the bar at chart datum</text><text x="800.0" y="548" text-anchor="middle" font-size="52" fill="#231e16" font-family="Source Serif 4, Georgia, serif">(the lowest tides): 1.6 m.</text><text x="800.0" y="616" text-anchor="middle" font-size="52" fill="#231e16" font-family="Source Serif 4, Georgia, serif">Add the height of the tide.</text><text x="800.0" y="684" text-anchor="middle" font-size="52" fill="#231e16" font-family="Source Serif 4, Georgia, serif"></text><text x="800.0" y="752" text-anchor="middle" font-size="52" fill="#231e16" font-family="Source Serif 4, Georgia, serif">No vessel shall cross with less than</text><text x="800.0" y="820" text-anchor="middle" font-size="52" fill="#231e16" font-family="Source Serif 4, Georgia, serif">0.5 m of water under her keel.</text><text x="1440" y="960" text-anchor="end" font-size="44" font-style="italic" fill="#231e16" font-family="Source Serif 4, Georgia, serif">J. Quick, Harbour Master.</text><path d="M120,1820 C400,1740 1200,1740 1480,1820 L1480,1880 L120,1880 Z" fill="#c9b07a" stroke="#231e16" stroke-width="3"/><text x="800" y="1840" text-anchor="middle" font-size="40" fill="#231e16" font-family="Source Serif 4, Georgia, serif">sandbank (the bar)</text><line x1="140" y1="1440" x2="1460" y2="1440" stroke="#5d8fb3" stroke-width="4" stroke-dasharray="18 12"/><text x="262" y="1480" font-size="32" fill="#2f5a86" font-family="Source Serif 4, Georgia, serif">chart datum (the lowest tides)</text><path d="M140,1180 q60,-18 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0" fill="none" stroke="#2f5a86" stroke-width="5"/><text x="150" y="1156" font-size="34" fill="#2f5a86" font-family="Source Serif 4, Georgia, serif">the tide tonight</text><line x1="230" y1="1440" x2="230" y2="1756" stroke="#231e16" stroke-width="4"/><path d="M216,1462 L230,1440 L244,1462 M216,1734 L230,1756 L244,1734" stroke="#231e16" stroke-width="4" fill="none"/><text x="252" y="1612.0" text-anchor="start" font-size="40" fill="#231e16" font-family="Source Serif 4, Georgia, serif">1.6 m</text><line x1="230" y1="1180" x2="230" y2="1440" stroke="#231e16" stroke-width="4"/><path d="M216,1202 L230,1180 L244,1202 M216,1418 L230,1440 L244,1418" stroke="#231e16" stroke-width="4" fill="none"/><text x="252" y="1324.0" text-anchor="start" font-size="40" fill="#231e16" font-family="Source Serif 4, Georgia, serif">+ tide</text><path d="M800,1134 L1330,1114 Q1300,1570 1230,1640 L900,1640 Q820,1550 800,1134 Z" fill="#3b2f22" stroke="#231e16" stroke-width="3"/><line x1="1090" y1="1124" x2="1090" y2="990" stroke="#3b2f22" stroke-width="10"/><line x1="900" y1="1130" x2="900" y2="1040" stroke="#3b2f22" stroke-width="8"/><line x1="1372" y1="1180" x2="1372" y2="1640" stroke="#231e16" stroke-width="4"/><path d="M1358,1202 L1372,1180 L1386,1202 M1358,1618 L1372,1640 L1386,1618" stroke="#231e16" stroke-width="4" fill="none"/><text x="1394" y="1424.0" text-anchor="start" font-size="40" fill="#231e16" font-family="Source Serif 4, Georgia, serif">draught</text><text x="1394" y="1468.0" font-size="30" font-style="italic" fill="#231e16" font-family="Source Serif 4, Georgia, serif">(how deep</text><text x="1394" y="1502.0" font-size="30" font-style="italic" fill="#231e16" font-family="Source Serif 4, Georgia, serif">she sits)</text><line x1="1060" y1="1644" x2="1060" y2="1746" stroke="#231e16" stroke-width="4"/><path d="M1046,1666 L1060,1644 L1074,1666 M1046,1724 L1060,1746 L1074,1724" stroke="#231e16" stroke-width="4" fill="none"/><text x="1038" y="1709.0" text-anchor="end" font-size="40" fill="#231e16" font-family="Source Serif 4, Georgia, serif">0.5 m</text><path d="M760,1680 L890,1644" stroke="#231e16" stroke-width="3"/><text x="750" y="1694" text-anchor="end" font-size="36" font-style="italic" fill="#231e16" font-family="Source Serif 4, Georgia, serif">keel</text></svg>